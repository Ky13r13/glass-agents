[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentctl-workspace"
version = "0.4.0"
description = "Project-local agent workflows, feedback loops, and a local dashboard"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agents = ["claude-agent-sdk==0.2.187", "jsonschema>=4.20,<5"]

[project.scripts]
agentctl = "agentctl.cli:main"

[tool.setuptools.packages.find]
include = ["agentctl*"]

[tool.setuptools.package-data]
agentctl = ["web/*.html", "web/*.js", "web/*.css", "web/*.webp"]
