name: Native Windows smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "jsonschema>=4.20,<5" .
      - run: python -m unittest discover -s tests -p test_portable_runtime.py -v
